[project]
name = "numel-playground"
version = "0.1.0"
description = "A framework and visual editor for building and running agentic AI workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core server
    "aiofiles",
    "debugpy",
    "django",
    "fastapi",
    "httpx",
    "psutil",
    "pydantic",
    "pydantic-settings",
    "pypdf",
    "python-dotenv",
    "python-multipart",
    "uvicorn",
    "watchdog",
    # Data science
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "pydicom",
    "pymeshlab",
    # Database
    "chromadb",
    "lancedb",
    "pgvector",
    "psycopg",
    "sqlalchemy",
    # Web tools
    "ddgs",
    "duckduckgo-search",
    "python-telegram-bot",
    # PyTorch (runtime images install the official CPU or cu128 wheels explicitly)
    "torch>=2.13.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.11.0",
    # AI / ML
    "agno",
    "ag-ui-protocol",
    "anthropic",
    "langchain",
    "langchain-text-splitters",
    "mediapipe",
    "ollama",
    "openai",
    "sentence-transformers",
    "tantivy",
    "transformers",
]

[project.scripts]
npg = "app.app:main"

[tool.uv]
python-downloads = "automatic"

[tool.uv.sources]
torch = [
	# { index = "pytorch-cpu"   },
	{ index = "pytorch-cu126" },
]
torchvision = [
	# { index = "pytorch-cpu"   },
	{ index = "pytorch-cu126" },
]

[[tool.uv.index]]
name     = "pytorch-cpu"
url      = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name     = "pytorch-cu126"
url      = "https://download.pytorch.org/whl/cu126"
explicit = true
