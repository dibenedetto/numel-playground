[project]
name = "numel-playground"
version = "0.1.0"
description = "A framework and visual editor for building and running agentic AI workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core server
    "aiofiles",
    "debugpy",
    "django",
    "fastapi",
    "httpx",
    "psutil",
    "pydantic",
    "pydantic-settings",
    "pypdf",
    "python-dotenv",
    "python-multipart",
    "uvicorn",
    "watchdog",
    # Data science
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "pydicom",
    "pymeshlab",
    # Database
    "chromadb",
    "lancedb",
    "pgvector",
    "psycopg",
    "sqlalchemy",
    # Web tools
    "ddgs",
    "duckduckgo-search",
    "python-telegram-bot",
    # PyTorch (runtime images install the official CPU or cu128 wheels explicitly)
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchaudio==2.10.0",
    # AI / ML
    "agno",
    "ag-ui-protocol",
    "anthropic",
    "langchain",
    "langchain-text-splitters",
    "mediapipe",
    "ollama",
    "openai",
    "sentence-transformers",
    "tantivy",
    "transformers",
]

[tool.uv]
python-downloads = "automatic"
torch-backend = "auto"
