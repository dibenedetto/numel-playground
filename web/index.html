<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Numel Playground</title>

		<link rel="stylesheet" href="schemagraph/schemagraph.css">
		<link rel="stylesheet" href="numel-workflow.css">
	</head>
	<body>
		<!-- Left Panel: Controls -->
		<div class="nw-panel">
			<h1 class="nw-title">
				<span class="nw-brand">Numel</span> Playground
			</h1>

			<!-- Connection Section -->
			<section class="nw-section">
				<div class="nw-section-header">
					<h3 class="nw-section-title">Connection</h3>
					<span id="wsStatus" class="nw-ws-badge disconnected">●</span>
				</div>
				<div class="nw-field">
					<label for="serverUrl">Server URL</label>
					<input type="url" id="serverUrl" value="http://localhost:11360" placeholder="http://localhost:11360">
				</div>
				<button id="connectBtn" class="nw-btn nw-btn-primary nw-btn-block">
					Connect
				</button>
			</section>

			<!-- Workflow Library Section -->
			<section class="nw-section">
				<div class="nw-section-header">
					<!-- <h3 class="nw-section-title">Workflows</h3> -->
					<h3 class="nw-section-title">Workflow</h3>
					<!-- <button id="refreshListBtn" class="nw-btn-icon" title="Refresh list">↻</button> -->
				</div>

				<!-- Mode Switch -->
				<div class="nw-switch-row" style="display: none;">
					<label class="nw-switch">
						<input type="checkbox" id="singleModeSwitch" checked>
						<span class="nw-switch-slider"></span>
					</label>
					<span class="nw-switch-label">Single workflow mode</span>
				</div>

				<!-- Multi-workflow controls (default) -->
				<div id="multiWorkflowControls" style="display: none;">
					<select id="workflowSelect" class="nw-select" disabled>
						<option value="">-- Select workflow --</option>
					</select>
					<div class="nw-btn-grid">
						<button id="loadWorkflowBtn" class="nw-btn nw-btn-secondary nw-btn-with-icon" disabled title="Load workflow">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15v4c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
							<span>Load</span>
						</button>
						<button id="removeWorkflowBtn" class="nw-btn nw-btn-danger nw-btn-with-icon" disabled title="Remove workflow">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
							<span>Remove</span>
						</button>
						<button id="uploadWorkflowBtn" class="nw-btn nw-btn-secondary nw-btn-with-icon" disabled title="Import from file">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
							<span>Import</span>
						</button>
						<button id="downloadWorkflowBtn" class="nw-btn nw-btn-secondary nw-btn-with-icon" disabled title="Download as JSON">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
							<span>Download</span>
						</button>
						<button id="copyWorkflowBtn" class="nw-btn nw-btn-secondary nw-btn-with-icon" disabled title="Copy to clipboard">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
							<span>Copy</span>
						</button>
						<button id="pasteWorkflowBtn" class="nw-btn nw-btn-secondary nw-btn-with-icon" disabled title="Paste from clipboard">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
							<span>Paste</span>
						</button>
						<button id="clearWorkflowBtn" class="nw-btn nw-btn-secondary nw-btn-with-icon nw-btn-grid-full" disabled title="Clear workflow">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64A9 9 0 1 1 5.64 5.64"/><polyline points="1 4 5.64 5.64 4 10"/></svg>
							<span>Clear</span>
						</button>
					</div>
				</div>

				<!-- Single workflow controls -->
				<div id="singleWorkflowControls">
					<div class="nw-field">
						<!-- <label>Current Workflow</label> -->
						<div id="singleWorkflowName" class="nw-mono-text">None</div>
					</div>
					<div class="nw-btn-grid">
						<button id="singleImportBtn" class="nw-btn nw-btn-secondary nw-btn-with-icon" disabled title="Import from file">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
							<span>Import</span>
						</button>
						<button id="singleDownloadBtn" class="nw-btn nw-btn-secondary nw-btn-with-icon" disabled title="Download as JSON">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
							<span>Download</span>
						</button>
						<button id="singleCopyBtn" class="nw-btn nw-btn-secondary nw-btn-with-icon" disabled title="Copy to clipboard">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
							<span>Copy</span>
						</button>
						<button id="singlePasteBtn" class="nw-btn nw-btn-secondary nw-btn-with-icon" disabled title="Paste from clipboard">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
							<span>Paste</span>
						</button>
						<button id="clearWorkflowBtnSingle" class="nw-btn nw-btn-secondary nw-btn-with-icon nw-btn-grid-full" disabled title="Clear workflow">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64A9 9 0 1 1 5.64 5.64"/><polyline points="1 4 5.64 5.64 4 10"/></svg>
							<span>Clear</span>
						</button>
					</div>
				</div>

				<!-- Workflow Options (Collapsible, inside Workflows section) -->
				<div class="nw-collapsible nw-subsection">
					<div class="nw-collapsible-header" data-target="workflowOptionsContent">
						<span class="nw-collapse-icon">▶</span>
						<span class="nw-subsection-title">Options</span>
					</div>
					<div id="workflowOptionsContent" class="nw-collapsible-content" style="display: none;">
						<div id="workflowOptionsForm" class="nw-form"></div>
					</div>
				</div>

				<input type="file" id="workflowFileInput" accept=".json" style="display:none;">
				<input type="file" id="singleWorkflowFileInput" accept=".json" style="display:none;">
			</section>

			<!-- Execution Section -->
			<section class="nw-section">
				<div class="nw-section-header">
					<h3 class="nw-section-title">Execution</h3>
				</div>
				<div class="nw-btn-row">
					<button id="startBtn" class="nw-btn nw-btn-success" disabled>▶ Start</button>
					<button id="cancelBtn" class="nw-btn nw-btn-danger" disabled>■ Cancel</button>
				</div>

				<!-- Execution Options (Collapsible, inside Execution section) -->
				<div class="nw-collapsible nw-subsection">
					<div class="nw-collapsible-header" data-target="execOptionsContent">
						<span class="nw-collapse-icon">▶</span>
						<span class="nw-subsection-title">Options</span>
					</div>
					<div id="execOptionsContent" class="nw-collapsible-content" style="display: none;">
						<div id="execOptionsForm" class="nw-form"></div>
					</div>
				</div>

				<div class="nw-field">
					<label>Status</label>
					<div id="execStatus" class="nw-status idle">Not running</div>
				</div>
				<div class="nw-field">
					<label>Execution ID</label>
					<div id="execId" class="nw-mono-text">-</div>
				</div>
			</section>

			<!-- Event Log Section -->
			<section class="nw-section nw-section-grow">
				<div class="nw-section-header">
					<h3 class="nw-section-title">Event Log</h3>
					<button id="clearLogBtn" class="nw-btn-icon" title="Clear log">🗑</button>
				</div>
				<div id="eventLog" class="nw-event-log"></div>
			</section>
		</div>

		<!-- Right Panel: Graph Canvas -->
		<div class="nw-canvas-panel">
			<div class="sg-canvas-container">
				<canvas id="sg-main-canvas"></canvas>
				<div id="sg-contextMenu" class="sg-context-menu"></div>
				<input type="text" id="sg-nodeInput" class="sg-node-input-overlay">
			</div>
		</div>

		<!-- Remove Confirmation Modal -->
		<div id="removeModal" class="nw-modal" style="display:none;">
			<div class="nw-modal-content">
				<div class="nw-modal-header">
					<h3>Remove Workflow</h3>
					<button id="closeRemoveModalBtn" class="nw-modal-close">&times;</button>
				</div>
				<div class="nw-modal-body">
					<p id="removeModalPrompt">Are you sure you want to remove this workflow?</p>
				</div>
				<div class="nw-modal-footer">
					<button id="cancelRemoveBtn" class="nw-btn nw-btn-secondary">Cancel</button>
					<button id="confirmRemoveBtn" class="nw-btn nw-btn-danger">Remove</button>
				</div>
			</div>
		</div>

		<!-- User Input Modal -->
		<div id="userInputModal" class="nw-modal" style="display:none;">
			<div class="nw-modal-content">
				<div class="nw-modal-header">
					<h3>User Input Required</h3>
					<button id="closeModalBtn" class="nw-modal-close">&times;</button>
				</div>
				<div class="nw-modal-body">
					<p id="userInputPrompt">Please provide input:</p>
					<textarea id="userInputField" class="nw-textarea" rows="4"></textarea>
				</div>
				<div class="nw-modal-footer">
					<button id="cancelInputBtn" class="nw-btn nw-btn-secondary">Cancel</button>
					<button id="submitInputBtn" class="nw-btn nw-btn-primary">Submit</button>
				</div>
			</div>
		</div>

		<!-- Footer -->
		<div class="nw-footer">
			© 2025 - 2026 - <a href="mailto:marco.dibenedetto@isti.cnr.it">Marco Di Benedetto</a>
		</div>

		<!--
		<div style="display: none;">
			<div class="sg-schema-manager">
				<div class="sg-schema-manager-title">📋 Registered Schemas:</div>
				<div id="sg-schemaList"></div>
			</div>
			<div class="sg-node-types" id="sg-nodeTypes">
				<strong>Registered Node Types:</strong> <span id="sg-nodeTypesList">None</span>
			</div>
		</div>
		-->

		<!-- Scripts -->
		<script src="dist/agui-client.bundle.js"></script>
		<script src="dist/codemirror-bundle.js"></script>
		<script src="dist/threejs-bundle.js"></script>

		<!-- Load scripts in correct order -->
		<script src="schemagraph/schemagraph-core.js"></script>
		<script src="schemagraph/schemagraph-workflow.js"></script>
		<script src="schemagraph/schemagraph-graph.js"></script>
		<script src="schemagraph/schemagraph-extensions.js"></script>
		<script src="schemagraph/schemagraph-controllers.js"></script>
		<script src="schemagraph/schemagraph-drawing.js"></script>
		<script src="schemagraph/schemagraph-history.js"></script>
		<script src="schemagraph/schemagraph-app.js"></script>
		<script src="schemagraph/schemagraph-bundle.js"></script>

		<!-- Tutorial extension (see docs/tutorial-extension.md) -->
		<script src="schemagraph/schemagraph-tutorial-ext.js"></script>

		<!-- Browser media extension (webcam, microphone, screen capture) -->
		<script src="schemagraph/schemagraph-media-ext.js"></script>

		<!-- ML stream extension (MediaPipe WASM frontend inference + overlay rendering) -->
		<script src="schemagraph/schemagraph-ml-ext.js"></script>

		<!-- 3D model preview extension (Three.js viewer for GLB/GLTF) -->
		<script src="schemagraph/schemagraph-3d-ext.js"></script>

		<!-- Chat extension -->
		<script src="schemagraph/schemagraph-chat-ext.js"></script>
		<script src="numel-agent-chat.js"></script>

		<script src="numel-file-upload.js"></script>
		<script src="numel-workflow.js"></script>
		<script src="numel-workflow-ui.js"></script>
	</body>
</html>
