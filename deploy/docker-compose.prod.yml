services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${NUMEL_POSTGRES_DB:-numel_platform}
      POSTGRES_USER: ${NUMEL_POSTGRES_USER:-numel}
      POSTGRES_PASSWORD: ${NUMEL_POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  docker:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
    volumes:
      - numel-data:${NUMEL_DATA_ROOT:-/var/lib/numel}
      - dind-storage:/var/lib/docker
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:2375/_ping | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  runtime-builder:
    image: docker:27-cli
    depends_on:
      docker:
        condition: service_healthy
    volumes:
      - ..:/src:ro
      - runtime-build-state:/var/lib/numel/runtime-builder
    working_dir: /src
    command:
      - sh
      - /src/deploy/runtime-builder.sh
      - numel-runtime:latest
      - runtime/numel_runtime/Dockerfile
      - /var/lib/numel/runtime-builder/cpu.sha256
    restart: "no"

  runtime-builder-cuda:
    image: docker:27-cli
    profiles: ["gpu"]
    depends_on:
      docker:
        condition: service_healthy
    volumes:
      - ..:/src:ro
      - runtime-build-state:/var/lib/numel/runtime-builder
    working_dir: /src
    command:
      - sh
      - /src/deploy/runtime-builder.sh
      - numel-runtime:cuda
      - runtime/numel_runtime/Dockerfile.cuda
      - /var/lib/numel/runtime-builder/cuda.sha256
    restart: "no"

  identity:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.identity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${NUMEL_POSTGRES_USER:-numel}:${NUMEL_POSTGRES_PASSWORD:-change-me}@postgres:5432/${NUMEL_POSTGRES_DB:-numel_platform}
      NUMEL_IDENTITY_SECRET_KEY: ${NUMEL_IDENTITY_SECRET_KEY:-change-me-too}
      NUMEL_IDENTITY_ALLOWED_HOSTS: "*"
    restart: unless-stopped

  numel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    depends_on:
      postgres:
        condition: service_healthy
      docker:
        condition: service_healthy
      runtime-builder:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    environment:
      NUMEL_PLATFORM_CONFIG: /app/deploy/platform_backend.prod.json
      NUMEL_DATA_ROOT: ${NUMEL_DATA_ROOT:-/var/lib/numel}
      NUMEL_POSTGRES_DB: ${NUMEL_POSTGRES_DB:-numel_platform}
      NUMEL_POSTGRES_USER: ${NUMEL_POSTGRES_USER:-numel}
      NUMEL_POSTGRES_PASSWORD: ${NUMEL_POSTGRES_PASSWORD:-change-me}
      NUMEL_IDENTITY_BASE_URL: ${NUMEL_IDENTITY_BASE_URL:-http://identity:8000}
      NUMEL_PORT: ${NUMEL_PORT:-11360}
    volumes:
      - numel-data:${NUMEL_DATA_ROOT:-/var/lib/numel}
      - ./platform_backend.prod.json:/app/deploy/platform_backend.prod.json:ro
    ports:
      - "${NUMEL_PORT:-11360}:11360"
    command:
      - sh
      - -lc
      - >
        python app/platform_migrate.py --config /app/deploy/platform_backend.prod.json
        && python app/app.py --port ${NUMEL_PORT:-11360}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11360/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  dind-storage:
  numel-data:
  runtime-build-state: